<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evidence Chain Trace Spine Brand Assets</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #171717;
        background: #f7f8f8;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      main {
        display: grid;
        gap: 22px;
        max-width: 1060px;
        margin: 0 auto;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 36px;
      }

      p {
        max-width: 740px;
        color: #5f6b72;
        line-height: 1.5;
      }

      section {
        display: grid;
        gap: 12px;
      }

      figure {
        margin: 0;
        border: 1px solid #d8dee3;
        border-radius: 12px;
        overflow: hidden;
        background: #ffffff;
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .marks {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .marks figure {
        display: grid;
        place-items: center;
        min-height: 220px;
      }

      .marks img {
        width: 128px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Trace Spine Brand Assets</h1>
        <p>The refined Evidence Chain mark uses the same grammar as the core product: signal, pattern, decision, shipped change, and learning loop.</p>
      </header>
      <section>
        <h2>Horizontal lockup</h2>
        <figure>
          <img src="../public/brand/evidence-chain-lockup-horizontal.svg" alt="Evidence Chain horizontal lockup" />
        </figure>
      </section>
      <section>
        <h2>Stacked lockup</h2>
        <figure>
          <img src="../public/brand/evidence-chain-lockup-stacked.svg" alt="Evidence Chain stacked lockup" />
        </figure>
      </section>
      <section>
        <h2>Marks</h2>
        <div class="marks">
          <figure>
            <img src="../public/brand/evidence-chain-mark.svg" alt="Evidence Chain mark dark" />
          </figure>
          <figure>
            <img src="../public/brand/evidence-chain-mark-light.svg" alt="Evidence Chain mark light" />
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
