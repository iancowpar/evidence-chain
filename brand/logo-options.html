<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evidence Chain Logo Options</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #171717;
        background: #f7f8f8;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      main {
        display: grid;
        gap: 22px;
        max-width: 1120px;
        margin: 0 auto;
      }

      header {
        display: grid;
        gap: 8px;
      }

      h1 {
        margin: 0;
        font-size: 36px;
        letter-spacing: 0;
      }

      p {
        max-width: 760px;
        margin: 0;
        color: #5f6b72;
        line-height: 1.5;
      }

      figure {
        margin: 0;
        border: 1px solid #d8dee3;
        border-radius: 12px;
        overflow: hidden;
        background: #ffffff;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Evidence Chain Logo Options</h1>
        <p>Three visual directions for the mark and lockup. All use the same product thesis: raw signal becomes a shipped decision through an inspectable audit trail.</p>
      </header>
      <figure>
        <img src="./logo-option-1-trace-spine.svg" alt="Option 1 Trace Spine" />
      </figure>
      <figure>
        <img src="./logo-option-2-decision-bracket.svg" alt="Option 2 Decision Bracket" />
      </figure>
      <figure>
        <img src="./logo-option-3-ec-audit-monogram.svg" alt="Option 3 EC Audit Monogram" />
      </figure>
    </main>
  </body>
</html>
